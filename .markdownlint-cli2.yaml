config:
  MD013:
    line_length: 80
    tables: false
    headings: false
    code_blocks: false
    # Allow long prose lines; Markdown renders them as paragraphs.
    stern: false

ignores:
  - ".npm-cache/**"
  - ".trivy-cache/**"
  - ".uv-cache/**"
  - "litellm/.venv/**"
  - ".uv-python/**"
  - ".tools/**"
  - ".pre-commit-cache/**"
