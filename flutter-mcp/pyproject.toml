[project]
name = "flutter-mcp-bridge"
version = "0.0.0"
description = "Host-side stdio-to-HTTP bridge for the Flutter/Dart MCP server"
requires-python = ">=3.12,<3.13"
dependencies = [
  "mcp-proxy==0.13.0",
]

[tool.uv]
package = false
required-version = "==0.13.5"

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true
