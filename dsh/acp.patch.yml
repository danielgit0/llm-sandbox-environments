# DSH ACP's user-facing model is DeepSeek V4.1 Flash. The shipped ACP row
# defaults to the internal deepseek-v4-flash ID; replace that row here.
- id: agent-default-model
  config:
    provider: deepseek-official
    model: deepseek-flash
- id: acp
  config:
    provider: deepseek-official
    model: deepseek-flash
