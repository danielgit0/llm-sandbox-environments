# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/main/schema/kit.schema.json
schemaVersion: "3"
kind: workload
displayName: DeepSeek Harness
description: DeepSeek Harness ACP workload with uv-managed Python and no pip.
dockerfile: ./kit.Dockerfile

capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/agent-context@1
    config:
      directory: /home/agent/workspace
      filename: AGENTS.md
      content: |
        DeepSeek Harness runs as the agent user inside this sandbox.
        Model traffic goes through the host LiteLLM gateway at
        host.docker.internal:4000; do not call provider APIs directly.
