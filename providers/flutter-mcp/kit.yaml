# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Host Flutter MCP bridge
description: Allows the sandbox to reach the host mcp-proxy Flutter MCP endpoint.
dockerfile: ./kit.Dockerfile
capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - localhost:3100
