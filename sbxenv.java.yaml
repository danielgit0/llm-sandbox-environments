schemaVersion: "1"
name: quarkus-sandbox

agent: dsh
# Placeholder; set the real path in sbxenv.java.local.yaml (gitignored).
workspace: /absolute/path/to/quarkus-project

kits:
  - ./dsh
  - ./tools/java
  - ./tools/openspec
  - ./mcps/codebase-memory-mcp
  - ./providers/litellm
  - ./providers/java-egress

sandboxOptions:
  cpus: 4
  memory: 8g
  skills: readonly

env:
  JAVA_HOME: /opt/graalvm
  DEEPSEEK_BASE_URL: http://host.docker.internal:4000/v1
  DEEPSEEK_API_KEY: not-needed
  LITELLM_BASE_URL: http://host.docker.internal:4000/v1
