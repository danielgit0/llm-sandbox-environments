schemaVersion: "1"
name: opencode-with-mcps

# The v3 workload name is the last component of its OCI reference.
agent: sbx-kit-opencode
workspace: ../workspace

kits:
  # Pinned by tag + manifest digest. Keep the digest in sync with SECURITY.md
  # and scripts/audit.sh when the kit is updated.
  - docker.io/docker/sbx-kit-opencode:1.19.5@sha256:f5dcf771efda91c2fe37a5280b93124e03d69a66f14242fb15ed4036e668be3b
  - ../mcps/codebase-memory-mcp
  - ../tools/openspec
  # Single model egress path. The sandbox cannot reach Ollama or providers
  # directly; LiteLLM runs on the host and is the only allowed destination.
  - ../providers/litellm

sandboxOptions:
  cpus: 4
  memory: 8g
  skills: readonly

# Example ports; remove entries you do not need.
ports:
  - sandbox: 8081
    host: 8081
    hostIP: 127.0.0.1
  - sandbox: 3000
    host: 3000
    hostIP: 127.0.0.1

env:
  LANG: C.UTF-8
  # Sandbox-side model URL. The egress host:port is literal in
  # providers/litellm/kit.yaml; keep the port in sync there and in run.sh.
  LITELLM_BASE_URL: http://host.docker.internal:4000/v1
  # OpenCode resolves this into workspace/opencode.json. Use a LiteLLM alias
  # from litellm/config.yaml. envs/opencode-local.yaml selects local-llm.
  OPENCODE_MODEL: litellm/deepseek-flash
