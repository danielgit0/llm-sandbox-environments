default_install_hook_types:
  - pre-commit
  - commit-msg

default_stages:
  - pre-commit

repos:
  # Basic hygiene: whitespace, merge conflicts, file endings, large files.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        args:
          - --allow-multiple-documents
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args:
          - --maxkb=1024
      - id: mixed-line-ending
        args:
          - --fix=lf
      - id: check-symlinks

  # Markdown formatting and consistency.
  - repo: https://github.com/DavidAnson/markdownlint-cli2
    rev: v0.21.0
    hooks:
      - id: markdownlint-cli2
        args:
          - --fix

  # Dockerfile static analysis.
  - repo: local
    hooks:
      - id: hadolint
        name: Lint Dockerfiles with Hadolint
        language: docker_image
        entry: --entrypoint hadolint docker.io/hadolint/hadolint:v2.14.0
        files: '(^|/)(Dockerfile|[^/]*\.Dockerfile)$'

  # Detect accidentally committed credentials and secrets.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks
