schemaVersion: "1"
name: flutter-sandbox

# Host Flutter MCP bridge: Flutter/Dart run on macOS, not in this sandbox.
agent: dsh
# Placeholder; set the real path in sbxenv.flutter.local.yaml (gitignored).
workspace: /absolute/path/to/flutter-app

kits:
  - ./dsh
  - ./tools/openspec
  - ./tools/dart
  - ./mcps/codebase-memory-mcp
  - ./providers/litellm

sandboxOptions:
  cpus: 4
  memory: 8g
  skills: readonly

env:
  DEEPSEEK_BASE_URL: http://host.docker.internal:4000/v1
  DEEPSEEK_API_KEY: not-needed
  LITELLM_BASE_URL: http://host.docker.internal:4000/v1
