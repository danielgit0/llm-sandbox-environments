# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/main/schema/kit.schema.json
schemaVersion: "3"
kind: mixin
displayName: OpenSpec CLI
description: Pinned OpenSpec 1.15.0 for spec-driven development in mounted projects.
sourceUrl: https://github.com/Fission-AI/OpenSpec
licenses:
  - MIT
dockerfile: ./kit.Dockerfile

args:
  version:
    default: "1.15.0"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    buildArg: OPENSPEC_VERSION

capabilities:
  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./context.md
