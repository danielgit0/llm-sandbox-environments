# Active model gateway. Start it from the repository root with:
#   litellm/run.sh
# It binds 127.0.0.1:4000; the sandbox reaches it through the proxy.
model_list:
  # The two user-facing DeepSeek models. DSH ACP advertises both; IntelliJ
  # can select either without an invalid-model error.
  - model_name: deepseek-flash
    litellm_params:
      model: deepseek/deepseek-v4-flash
      api_key: os.environ/DEEPSEEK_API_KEY

  - model_name: deepseek-v4-pro
    litellm_params:
      model: deepseek/deepseek-v4-pro
      api_key: os.environ/DEEPSEEK_API_KEY

  # Any other OpenAI-compatible provider:
  # - model_name: openrouter-deepseek
  #   litellm_params:
  #     model: openrouter/deepseek/deepseek-chat
  #     api_key: os.environ/OPENROUTER_API_KEY
